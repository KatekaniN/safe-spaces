<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>SafeSpaces</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">SafeSpaces Listener</h3>

                <div class="row g-3 align-items-center mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Secret trigger word</label>
                        <input id="triggerInput" class="form-control" placeholder="Enter trigger word (e.g., 'hello Lila')" maxlength="50" />
                        <div id="triggerHelp" class="form-text">Stored locally in your browser session.</div>
                    </div>

                    <div class="col-auto">
                        <label class="form-label d-block">&nbsp;</label>
                        <button id="addTextTriggerBtn" class="btn btn-primary">Save trigger</button>
                    </div>

                    <div class="col-auto">
                        <label class="form-label d-block">&nbsp;</label>
                        <button id="recordTriggerBtn" class="btn btn-info">
                            <span class="bi-mic-fill"></span> Hold to Record Trigger
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <span id="listeningStatus" class="me-3">
                        <span class="bi-mic-fill">🎤</span> Listening: <strong id="listeningText">stopped</strong>
                    </span>
                    <span id="recordingStatus" class="me-3">
                        <span id="recordIndicator" style="display:none">🔴</span> Recording: <strong id="recordingText">idle</strong>
                        <span id="countdown" class="ms-2"></span>
                    </span>
                    <div id="messages" class="mt-2 text-muted small"></div>
                </div>

                <div class="mb-4">
                    <h5>Custom Triggers</h5>
                    <div id="triggersList" class="list-group"></div>
                </div>

                <hr />

                <h5>Saved Recordings</h5>
                <div id="recordingsList" class="list-group"></div>
            </div>
        </div>
    </div>

    <script>
        window.SafeSpacesConfig = {
            apiBaseUrl: "http://localhost:5284/api" 
        };
    </script>
    <script src="js/app.js"></script>
</body>
</html>
