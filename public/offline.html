<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline • Safe Spaces</title>
    <meta name="theme-color" content="#8764C1" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #FAFAFA; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .card { background: #fff; border: 2px solid #E5E7EB; border-radius: 16px; padding: 20px; width: min(560px, 92vw); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
      h1 { margin: 0 0 8px; color: #8764C1; font-size: 22px; }
      p { margin: 0; color: #6B7280; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>Some features aren’t available without an internet connection. We’ll reconnect automatically when you’re back online.</p>
    </div>
  </body>
</html>
